<!DOCTYPE html>
<html lang="en" data-theme="deepblue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Shipping Labels Sorter & Filter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* =========================================================
           DYNAMIC BRAND THEMES (Navy, Teal, Vibrant Orange)
           ========================================================= */
        :root, [data-theme="light"] {
            --primary: #FF6B35;          
            --primary-dark: #e55a25;
            --primary-light: rgba(255, 107, 53, 0.15);
            
            --bg: #f4f6f9;
            --surface: #ffffff;
            --surface-hover: #f0f3f7;
            
            --text: #081C24;             
            --text-muted: #5e737e;
            --border: #d0d7de;
            
            --shadow-color: rgba(8, 28, 36, 0.08);
            --shadow-hover: rgba(8, 28, 36, 0.15);
            
            --btn-teal-bg: #0F4C5C;
            --btn-teal-hover: #0c3e4b;
            --btn-navy-bg: #081C24;
            --btn-navy-hover: #051318;
            
            --history-bg: #ffffff;
            --highlight-bg: rgba(255, 107, 53, 0.08);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-hover: #2a2a2a;
            
            --text: #e0e0e0;
            --text-muted: #9aa0a6;
            --border: #333333;
            
            --shadow-color: rgba(0, 0, 0, 0.4);
            --shadow-hover: rgba(0, 0, 0, 0.6);
            
            --btn-teal-bg: #0F4C5C;
            --btn-teal-hover: #166b82;
            --btn-navy-bg: #2d434d;
            --btn-navy-hover: #3a5663;
            
            --history-bg: #1a1a1a;
            --highlight-bg: rgba(255, 107, 53, 0.12);
        }

        [data-theme="deepblue"] {
            --bg: #081C24;               
            --surface: #0F4C5C;          
            --surface-hover: #135b6e;
            
            --text: #ffffff;
            --text-muted: #a1b0b8;
            --border: #1f5f70;
            
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            
            --btn-teal-bg: #166b82;      
            --btn-teal-hover: #1b819c;
            --btn-navy-bg: #051318;      
            --btn-navy-hover: #030b0f;
            
            --history-bg: #0b3440;
            --highlight-bg: rgba(255, 107, 53, 0.15);
        }

        [data-theme="eyeprotectant"] {
            --bg: #f4ecd8;
            --surface: #fdf6e3;
            --surface-hover: #f2e7cd;
            
            --text: #4c4031;
            --text-muted: #756a5c;
            --border: #d9ceb2;
            
            --shadow-color: rgba(100, 80, 50, 0.08);
            --shadow-hover: rgba(100, 80, 50, 0.15);
            
            --btn-teal-bg: #0F4C5C;
            --btn-teal-hover: #0c3e4b;
            --btn-navy-bg: #081C24;
            --btn-navy-hover: #051318;
            
            --history-bg: #fdf6e3;
            --highlight-bg: rgba(255, 107, 53, 0.1);
        }

        body[data-font="small"] { --font-size-base: 13px; }
        body[data-font="medium"] { --font-size-base: 15px; }
        body[data-font="large"] { --font-size-base: 18px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: var(--font-size-base);
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        .control-panel {
            background-color: var(--surface);
            padding: 18px 25px;
            box-shadow: 0 4px 20px var(--shadow-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 4px solid var(--primary);
            transition: background-color 0.4s ease;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        h2 {
            margin: 0;
            flex-grow: 1;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text);
        }

        .settings-group {
            display: flex;
            gap: 18px;
            align-items: center;
            font-size: 0.9em;
        }

        .settings-group label {
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 6px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background-color: var(--primary);
            color: #ffffff;
            padding: 0.75em 1.6em;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px var(--shadow-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--primary-light);
        }

        .btn:disabled {
            background-color: var(--border) !important;
            color: var(--text-muted) !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            opacity: 0.6;
            transform: none !important;
        }

        .btn-teal { background-color: var(--btn-teal-bg); }
        .btn-teal:hover:not(:disabled) { background-color: var(--btn-teal-hover); box-shadow: 0 6px 15px var(--shadow-hover); }

        .btn-navy { background-color: var(--btn-navy-bg); }
        .btn-navy:hover:not(:disabled) { background-color: var(--btn-navy-hover); box-shadow: 0 6px 15px var(--shadow-hover); }

        .btn-red { background-color: #dc3545; }
        .btn-red:hover:not(:disabled) { background-color: #c82333; }

        .btn-outline {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .btn-outline:hover:not(:disabled) { background-color: var(--surface-hover); }

        .btn-small { padding: 0.5em 1em; font-size: 0.85em; }

        .options-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95em;
            font-weight: 600;
        }

        select, .search-box input[type="text"] {
            padding: 0.6em 1em;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, .search-box input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-box input[type="text"] { width: 280px; }

        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #status {
            font-weight: 600;
            font-size: 0.95em;
            color: var(--primary);
            width: 100%;
            margin-top: 5px;
        }

        .summary-dashboard, .saved-files-panel {
            max-width: 1150px;
            margin: 25px auto 0;
            padding: 0 20px;
        }

        .summary-card {
            background: var(--surface);
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            border-left: 5px solid var(--primary);
        }

        .summary-title {
            font-size: 0.9em;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            font-size: 0.95em;
            margin-top: 15px;
        }

        .summary-stat {
            background: var(--surface-hover);
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .summary-stat span {
            font-weight: 700;
            color: var(--primary);
        }

        .saved-files-header {
            font-size: 1.15em;
            margin-bottom: 15px;
            color: var(--text);
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box-container {
            display: flex; 
            flex-direction: column; 
            align-items: flex-end;
        }

        .search-box {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #search-result {
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--history-bg);
            padding: 16px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px var(--shadow-color);
            border: 1px solid var(--border);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
        }
        
        .history-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--shadow-hover);
        }
        
        .history-item.printed-row {
            border-left: 5px solid #28a745;
            opacity: 0.85;
        }

        .history-item.highlight-match {
            background-color: var(--highlight-bg);
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .history-name {
            font-weight: 700;
            font-size: 1.05em;
            color: var(--text);
        }

        .history-meta-row {
            display: flex;
            gap: 12px;
            font-size: 0.85em;
            color: var(--text-muted);
            align-items: center;
            flex-wrap: wrap;
        }

        .company-badge {
            background-color: var(--surface-hover);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .history-date { color: var(--text-muted); font-weight: 500;}

        .history-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0; 
            justify-content: flex-end;
        }

        .print-status-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            background: var(--surface-hover);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text);
            transition: background 0.2s;
        }

        #labels-container {
            max-width: 700px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .label-card {
            background: #ffffff; 
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 25px var(--shadow-color);
            position: relative;
        }

        canvas {
            border: 1px dashed #b5b5b5;
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        @media print {
            @page { margin: 0; } 
            .no-print { display: none !important; }
            body { background-color: white !important; margin: 0; color: black !important; }
            #labels-container { margin: 0; padding: 0; max-width: 100%; display: block; }
            
            .label-card { 
                box-shadow: none; 
                padding: 0; 
                margin: 0; 
                page-break-after: always; 
                page-break-inside: avoid; 
                display: flex;
                justify-content: center;
                align-items: center;
                height: 98vh;
            }
            canvas { border: none; max-width: 100% !important; max-height: 100% !important; object-fit: contain; }
        }
    </style>
</head>
<body data-font="medium">

    <div class="control-panel no-print">
        <div class="container header-top">
            <h2>📦 Amazon Label Sorter (Cloud Sync)</h2>
            <div class="settings-group">
                <div>
                    <label for="theme-selector">Theme:</label>
                    <select id="theme-selector">
                        <option value="deepblue" selected>Basic Theme</option>
                        <option value="light">White</option>
                        <option value="dark">Dark</option>
                        <option value="eyeprotectant">Eye Protectant</option>
                    </select>
                </div>
                <div>
                    <label for="font-selector">Text Size:</label>
                    <select id="font-selector">
                        <option value="small">Small</option>
                        <option value="medium" selected>Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="container" style="justify-content: space-between;">
            
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <div class="file-input-wrapper">
                    <button class="btn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        Select PDF File
                    </button>
                    <input type="file" id="pdf-file" accept="application/pdf" />
                </div>

                <button class="btn btn-navy" id="print-btn" disabled onclick="handleTopAction('print')">🖨️ Print Labels Only</button>
                <button class="btn btn-teal" id="download-btn" disabled onclick="handleTopAction('download')">⬇️ Download PDF</button>
            </div>

            <div class="options-group" style="margin-left: auto;">
                <label for="sort-strategy">Sort A-Z By:</label>
                <select id="sort-strategy">
                    <option value="sku">Product SKU</option>
                    <option value="buyer">Customer Name / Order ID</option>
                </select>
            </div>

            <div id="status">Waiting for cloud initialization...</div>
        </div>
    </div>

    <div class="summary-dashboard no-print" id="summary-dashboard" style="display: none;">
        <div class="summary-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                <div class="summary-title">📈 Batch Printing Summary Overview</div>
                <button class="btn btn-red btn-small" onclick="deleteAllCloudFiles()">🗑️ Delete All</button>
            </div>
            <div class="summary-grid" id="summary-grid"></div>
        </div>
    </div>

    <div class="saved-files-panel no-print">
        <div class="saved-files-header">
            <span>📂 Cloud Saved File History (All Desktops synced)</span>
            
            <div class="search-box-container">
                <div class="search-box">
                    <button class="btn btn-small" id="merge-print-btn" style="display: none;" onclick="processMultipleFiles()">📑 Print Selected</button>
                    
                    <label style="display:flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:var(--text); cursor:pointer;">
                        <input type="checkbox" id="multi-search-cb" onchange="toggleMultiSearch()"> Multi
                    </label>
                    <input type="text" id="order-search-input" placeholder="🔍 Search Order ID...">
                    <button class="btn btn-teal btn-small" onclick="searchForOrder()">Locate</button>
                </div>
                <div id="multi-hint" style="display: none; font-size: 11.5px; font-weight: bold; color: var(--primary); margin-top: 6px; padding-right: 75px;">
                    ⚠️ Use commas (,) to separate multiple Order IDs
                </div>
            </div>
            
        </div>
        <div id="search-result"></div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div id="labels-container"></div>

    <script>
        /* --- UI SETTINGS CONTROLS WITH MEMORY --- */
        // Load saved preferences on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('amazon_label_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('theme-selector').value = savedTheme;
            }
            
            const savedFont = localStorage.getItem('amazon_label_font');
            if (savedFont) {
                document.body.setAttribute('data-font', savedFont);
                document.getElementById('font-selector').value = savedFont;
            }
        });

        // Save preferences when changed
        document.getElementById('theme-selector').addEventListener('change', (e) => {
            const theme = e.target.value;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('amazon_label_theme', theme); // Save to browser memory
        });

        document.getElementById('font-selector').addEventListener('change', (e) => {
            const font = e.target.value;
            document.body.setAttribute('data-font', font);
            localStorage.setItem('amazon_label_font', font); // Save to browser memory
        });

        /* --- PDF PROCESSING CORE --- */
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let processedOrders = [];
        let currentPdfDoc = null;
        let temporaryExtractedCompany = "Unknown Seller";
        let currentActiveFileName = "Amazon_Labels.pdf"; 
        window.cloudFiles = []; 
        window.activeSearchQueries = [];

        document.getElementById('pdf-file').addEventListener('change', handleNewUpload);
        document.getElementById('sort-strategy').addEventListener('change', renderSortedLabels);
        
        document.getElementById('order-search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchForOrder();
        });

        document.getElementById('order-search-input').addEventListener('input', function(e) {
            if (e.target.value.trim() === '') searchForOrder();
        });

        function calculateSummaryDashboard(files) {
            const dashboard = document.getElementById('summary-dashboard');
            const grid = document.getElementById('summary-grid');
            
            while (grid.firstChild) {
                grid.removeChild(grid.firstChild);
            }
            
            let totalBatches = files.length;
            let totalPrinted = files.filter(f => f.isPrinted).length;
            
            let companyCounts = {};
            files.forEach(f => {
                let comp = f.companyName || "Unknown Seller";
                let labelCount = parseInt(f.totalLabels) || (f.extractedOrderIds ? f.extractedOrderIds.length : 0);

                if(!companyCounts[comp]) {
                    companyCounts[comp] = { totalFiles: 0, printedFiles: 0, pendingFiles: 0, totalLabels: 0 };
                }
                
                companyCounts[comp].totalFiles++;
                companyCounts[comp].totalLabels += labelCount; 
                
                if(f.isPrinted) companyCounts[comp].printedFiles++;
                else companyCounts[comp].pendingFiles++;
            });

            dashboard.style.display = 'block';

            const totalUploadedDiv = document.createElement('div');
            totalUploadedDiv.className = 'summary-stat';
            totalUploadedDiv.textContent = 'Uploaded Files: ';
            const totalUploadedSpan = document.createElement('span');
            totalUploadedSpan.textContent = totalBatches;
            totalUploadedDiv.appendChild(totalUploadedSpan);
            grid.appendChild(totalUploadedDiv);

            const completedPrintsDiv = document.createElement('div');
            completedPrintsDiv.className = 'summary-stat';
            completedPrintsDiv.textContent = 'Completed Prints: ';
            const completedPrintsSpan = document.createElement('span');
            completedPrintsSpan.textContent = `${totalPrinted} / ${totalBatches}`;
            completedPrintsDiv.appendChild(completedPrintsSpan);
            grid.appendChild(completedPrintsDiv);

            Object.keys(companyCounts).forEach(company => {
                const stats = companyCounts[company];
                const cleanBlock = document.createElement('div');
                cleanBlock.className = "summary-stat";
                
                cleanBlock.appendChild(document.createTextNode(`${company} `));

                const labelsSpan = document.createElement('span');
                labelsSpan.textContent = `(🏷️ ${stats.totalLabels} Labels): `;
                cleanBlock.appendChild(labelsSpan);

                const totalFilesSpan = document.createElement('span');
                totalFilesSpan.style.color = "var(--text)";
                totalFilesSpan.textContent = `${stats.totalFiles} files | `;
                cleanBlock.appendChild(totalFilesSpan);

                const printedSpan = document.createElement('span');
                printedSpan.style.color = '#28a745';
                printedSpan.textContent = `${stats.printedFiles} printed | `;
                cleanBlock.appendChild(printedSpan);

                const pendingSpan = document.createElement('span');
                pendingSpan.style.color = '#dc3545';
                pendingSpan.textContent = `${stats.pendingFiles} pending`;
                cleanBlock.appendChild(pendingSpan);

                grid.appendChild(cleanBlock);
            });
        }

        async function handleNewUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            // PREVENT DUPLICATE UPLOADS
            if (window.cloudFiles && window.cloudFiles.some(f => f.name === file.name)) {
                alert(`Already added! The file "${file.name}" already exists in your history.`);
                e.target.value = ""; // reset input
                return;
            }
            
            currentActiveFileName = file.name;
            await runCoreEngine(file);

            if (typeof window.saveFileToStorage === 'function') {
                await window.saveFileToStorage(file, temporaryExtractedCompany, processedOrders);
            }
        }

        async function downloadCurrentLabels() {
            const { jsPDF } = window.jspdf;
            const canvases = document.querySelectorAll('#labels-container canvas');
            const statusEl = document.getElementById('status');
            
            if (canvases.length === 0) {
                alert("No labels generated to download!");
                return;
            }

            statusEl.textContent = "Generating compressed PDF... Please wait.";

            try {
                const firstCanvas = canvases[0];
                const width = firstCanvas.width;
                const height = firstCanvas.height;
                
                const pdf = new jsPDF({
                    orientation: width > height ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [width, height],
                    compress: true 
                });

                for (let i = 0; i < canvases.length; i++) {
                    if (i > 0) pdf.addPage([canvases[i].width, canvases[i].height]);
                    
                    const imgData = canvases[i].toDataURL('image/jpeg', 0.45);
                    pdf.addImage(imgData, 'JPEG', 0, 0, canvases[i].width, canvases[i].height);
                }

                let dynamicName = currentActiveFileName.replace(/\.[^/.]+$/, "") + "_rearranged.pdf";
                pdf.save(dynamicName);
                
                statusEl.textContent = "Download complete!";
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error generating PDF download.";
            }
        }

        async function runCoreEngine(fileOrBlob, appendMode = false) {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('labels-container');
            
            if (!appendMode) {
                container.innerHTML = '';
                processedOrders = [];
            }
            
            statusEl.textContent = "Analyzing PDF structure and linking images to text...";
            
            if (!appendMode) temporaryExtractedCompany = "Unknown Seller";
            document.getElementById('print-btn').disabled = true;
            document.getElementById('download-btn').disabled = true;
            
            try {

                        if (buyerMatch) buyerName = buyerMatch[1].trim();
                        atsplTargetToken = group.labelTextData.items.find(item => item.str.includes("ATSPL"));
                    }

                    let combinedInvoiceText = "";
                    for (const inv of group.invoicePages) {
                        combinedInvoiceText += inv.textData.text + " \n ";

                    if (combinedInvoiceText) {

                            let textChunk = combinedInvoiceText.substring(newSkuRegex.lastIndex, newSkuRegex.lastIndex + 250);

                            }
                        }

                        if (skus.length === 0) {
                            const tableRegex = /\d{2,4}-\d{2}-\d{2,4}["']?\s*,\s*["']?([^"'\n\r,]+)["']?/gi;
                            let tableMatch;
                            while ((tableMatch = tableRegex.exec(combinedInvoiceText)) !== null) {

                                if (possibleSku && possibleSku.length > 2) {
                                    skus.push(possibleSku);
                                }
                            }

                            if (skus.length > 0) {
                                let generalRupeeMatch = combinedInvoiceText.match(/₹\s*[\d,.]+\s+(?:-?₹\s*[\d,.]+\s+)?(\d{1,4})\s+₹/);
                                if (generalRupeeMatch) qtys.push(generalRupeeMatch[1].trim());
                                else qtys.push("1");
                            }
                        }

                        if (skus.length === 0) {
                            const fallbackMatch = combinedInvoiceText.match(/(MASSAGER|HAIR TRIMMER|SPORTING GOODS|WATER DISPENSER)/i);
                            if (fallbackMatch) skus.push(fallbackMatch[1].trim());
                            
                            if (skus.length > 0) {
                                let generalRupeeMatch = combinedInvoiceText.match(/₹\s*[\d,.]+\s+(?:-?₹\s*[\d,.]+\s+)?(\d{1,4})\s+₹/);
                                if (generalRupeeMatch) qtys.push(generalRupeeMatch[1].trim());
                                else qtys.push("1");
                            }
                        }

                        let finalSkuString = "UNKNOWN";
                        let totalQty = 1;

                        if (skus.length > 0) {
                            let itemBreakdowns = [];
                            totalQty = 0;
                            
                            for (let i = 0; i < skus.length; i++) {
                                let q = qtys[i] || "1"; 
                                itemBreakdowns.push(`${skus[i]} (QTY: ${q})`);
                                totalQty += parseInt(q, 10) || 1;
                            }
                            finalSkuString = itemBreakdowns.join(" | "); 
                        }

                        sku = finalSkuString;
                        qty = totalQty.toString();
                    }

                    processedOrders.push({
                        pdfDoc: docInst,

        async function extractTextAndPositions(page) {

        async function renderSortedLabels() {
            if (processedOrders.length === 0) return;

            const container = document.getElementById('labels-container');
            container.innerHTML = '<p class="no-print" style="color: var(--text-muted); font-weight: 600;">Arranging and sorting templates...</p>';

            const sorted = [...processedOrders].sort((a, b) => {
                let valA = strategy === 'sku' ? a.sku : a.buyerName;
                let valB = strategy === 'sku' ? b.sku : b.buyerName;
                return valA.localeCompare(valB, undefined, { sensitivity: 'base', numeric: true });
            });

            container.innerHTML = '';

            for (const order of sorted) {
                const card = document.createElement('div');
                card.className = 'label-card';
                
                const canvas = document.createElement('canvas');
                card.appendChild(canvas);
                container.appendChild(card);

                const docToUse = order.pdfDoc || currentPdfDoc;
                const page = await docToUse.getPage(order.labelPageNum);
                
                const scale = 1.2; 
                const viewport = page.getViewport({ scale });
                const ctx = canvas.getContext('2d');
                
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                let renderX, renderY;

                if (order.atsplToken) {
                    const [cx, cy] = viewport.convertToViewportPoint(order.atsplToken.transform[4], order.atsplToken.transform[5]);
                    renderX = cx;
                    renderY = cy - (16 * scale); 
                } else {
                    renderX = canvas.width * 0.06;
                    renderY = canvas.height * 0.81;
                }

                const textToInject = `QTY: ${order.qty} | ${order.sku}`;

                let fontSize = 16;
                if (textToInject.length > 45) fontSize = 12;
                if (textToInject.length > 65) fontSize = 10;
                if (textToInject.length > 85) fontSize = 8; 

                ctx.fillStyle = "black";
                ctx.font = `bold ${fontSize * scale}px Arial`;
                                
                ctx.fillStyle = "white";
                const metrics = ctx.measureText(textToInject);

                const boxPadding = 12;
                const boxHeight = (fontSize + 3) * scale;
                ctx.fillRect(renderX - 4, renderY - (fontSize * scale), metrics.width + boxPadding, boxHeight);
                                
                ctx.fillStyle = "black";
                ctx.fillText(textToInject, renderX, renderY);
            }
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64PdfString = e.target.result;
            const CHUNK_SIZE = 800000; 
            const numChunks = Math.ceil(base64PdfString.length / CHUNK_SIZE);

            try {
              const orderDocRef = await addDoc(collection(db, "orders"), {
                name: file.name,
                companyName: companyName,
                isPrinted: false,
                date: new Date().toLocaleString(),
                timestamp: Date.now(), 
                totalLabels: processedDataArray.length, 
                chunksCount: numChunks,
                // Saving specific page numbers string format: "ORDERID::PAGENUMBER"
                extractedOrderData: processedDataArray.map(o => `${o.orderId}::${o.labelPageNum}`),
                extractedOrderIds: processedDataArray.map(o => o.orderId).filter(id => id !== "Unknown")
              });

              let completedChunks = 0;
              const uploadPromises = [];

              for (let i = 0; i < numChunks; i++) {
                  const chunkData = base64PdfString.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                  
                  const uploadTask = addDoc(collection(db, `orders/${orderDocRef.id}/chunks`), {
                      index: i,
                      data: chunkData
                  }).then(() => {
                      completedChunks++;
                      statusEl.textContent = `Rapid syncing: chunk ${completedChunks} of ${numChunks}...`;
                  });
                  
                  uploadPromises.push(uploadTask);
              }

              await Promise.all(uploadPromises);

              statusEl.textContent = "Saved to cloud successfully!";
              window.loadHistoryUI(); 
            } catch (error) {
              console.error("Cloud Error:", error);
              statusEl.textContent = "Error saving asset to cloud. Verify Firestore rules.";
            }

                const deletePromises = window.cloudFiles.map(async (file) => {
                    const docId = file.id;
                    const chunksSnapshot = await getDocs(collection(db, `orders/${docId}/chunks`));
                    
                    const chunkDeletes = chunksSnapshot.docs.map(chunkDoc => deleteDoc(chunkDoc.ref));
                    await Promise.all(chunkDeletes);
                    
                    return deleteDoc(doc(db, "orders", docId));
                });

                await Promise.all(deletePromises);
                
                window.loadHistoryUI();
                statusEl.textContent = "All operational files successfully purged.";
            } catch (error) {
                console.error("Global Purge Error:", error);
                statusEl.textContent = "Error executing global delete protocol.";
            }
        }
      };

      window.searchForOrder = function() {
        const inputVal = document.getElementById('order-search-input').value;
        const cb = document.getElementById('multi-search-cb');
        const resultEl = document.getElementById('search-result');
        const printBtn = document.getElementById('print-btn');
        const downBtn = document.getElementById('download-btn');
        
        if(!inputVal.trim()) { 
            resultEl.innerHTML = ""; 
            window.activeSearchQueries = [];
            
            // Revert top buttons to normal state
            printBtn.innerHTML = "🖨️ Print Labels Only";
            downBtn.innerHTML = "⬇️ Download PDF";
            printBtn.style.backgroundColor = "";
            printBtn.style.boxShadow = "";
            printBtn.disabled = processedOrders.length === 0;
            downBtn.disabled = processedOrders.length === 0;
            
            window.renderHistoryList(window.cloudFiles); // Restore to default state
            return; 
        }
        
        // Split specifically by comma if multi is checked
        let queries = [];
        if (cb.checked) {
            queries = inputVal.split(',').map(s => s.trim()).filter(s => s);
        } else {
            queries = [inputVal.trim()];
        }
        window.activeSearchQueries = queries;

        let matchedFiles = [];
        let unmatchedFiles = [];
        let matchedIds = [];
        let matchedNames = [];

        if (window.cloudFiles) {
            window.cloudFiles.forEach(f => {
                let hasMatch = false;
                let matchedPages = [];

                if (f.extractedOrderData) {
                    f.extractedOrderData.forEach(str => {
                        const parts = str.split('::');
                        if (parts.length === 2 && queries.includes(parts[0])) {
                            hasMatch = true;
                            matchedPages.push(parts[1]);
                        }
                    });
                } else if (f.extractedOrderIds) {
                    // Fallback for old history data before this feature was added
                    if (queries.some(q => f.extractedOrderIds.includes(q))) {
                        hasMatch = true;
                    }
                }

                if (hasMatch) {
                    f._tempMatchedPages = matchedPages.length > 0 ? [...new Set(matchedPages)].join(', ') : "Unknown";
                    matchedFiles.push(f);
                    matchedIds.push(f.id);
                    matchedNames.push(f.name);
                } else {
                    unmatchedFiles.push(f);
                }
            });
        }
        
        if(matchedFiles.length > 0) {
            resultEl.style.color = "var(--primary)";
            resultEl.innerHTML = `✅ Found in: <strong>${matchedNames.join(', ')}</strong>.`;
            
            // HIGHLIGHT THE TOP BUTTONS FOR SPECIFIC PRINTING
            printBtn.innerHTML = `🖨️ Print Searched (${queries.length})`;
            downBtn.innerHTML = `⬇️ Download Searched (${queries.length})`;
            printBtn.style.backgroundColor = "var(--primary)";
            printBtn.style.boxShadow = "0 0 12px var(--primary-light)";
            printBtn.disabled = false;
            downBtn.disabled = false;

            // Render the matched items FIRST so they pop to the top, followed by the rest
            window.renderHistoryList([...matchedFiles, ...unmatchedFiles], matchedIds);
        } else {
            resultEl.style.color = "#dc3545";
            resultEl.innerHTML = `❌ Order ID not located. Confirm character formatting matches parameters.`;

            // Reset top buttons to normal state, but disable them since search failed
            printBtn.innerHTML = "🖨️ Print Labels Only";
            downBtn.innerHTML = "⬇️ Download PDF";
            printBtn.style.backgroundColor = "";
            printBtn.style.boxShadow = "";
            printBtn.disabled = true;
            downBtn.disabled = true;

            window.renderHistoryList(window.cloudFiles); // Render default if no match
        }
      };

      window.loadHistoryUI();
    </script>
</body>
