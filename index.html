<!DOCTYPE html>
<html lang="en" data-theme="deepblue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Shipping Labels Sorter & Filter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* =========================================================
           DYNAMIC BRAND THEMES (Navy, Teal, Vibrant Orange)
           ========================================================= */
        :root, [data-theme="light"] {
            --primary: #FF6B35;          
            --primary-dark: #e55a25;
            --primary-light: rgba(255, 107, 53, 0.15);
            
            --bg: #f4f6f9;
            --surface: #ffffff;
            --surface-hover: #f0f3f7;
            
            --text: #081C24;             
            --text-muted: #5e737e;
            --border: #d0d7de;
            
            --shadow-color: rgba(8, 28, 36, 0.08);
            --shadow-hover: rgba(8, 28, 36, 0.15);
            
            --btn-teal-bg: #0F4C5C;
            --btn-teal-hover: #0c3e4b;
            --btn-navy-bg: #081C24;
            --btn-navy-hover: #051318;
            
            --history-bg: #ffffff;
            --highlight-bg: rgba(255, 107, 53, 0.08);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-hover: #2a2a2a;
            
            --text: #e0e0e0;
            --text-muted: #9aa0a6;
            --border: #333333;
            
            --shadow-color: rgba(0, 0, 0, 0.4);
            --shadow-hover: rgba(0, 0, 0, 0.6);
            
            --btn-teal-bg: #0F4C5C;
            --btn-teal-hover: #166b82;
            --btn-navy-bg: #2d434d;
            --btn-navy-hover: #3a5663;
            
            --history-bg: #1a1a1a;
            --highlight-bg: rgba(255, 107, 53, 0.12);
        }

        [data-theme="deepblue"] {
            --bg: #081C24;                
            --surface: #0F4C5C;          
            --surface-hover: #135b6e;
            
            --text: #ffffff;
            --text-muted: #a1b0b8;
            --border: #1f5f70;
            
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            
            --btn-teal-bg: #166b82;      
            --btn-teal-hover: #1b819c;
            --btn-navy-bg: #051318;      
            --btn-navy-hover: #030b0f;
            
            --history-bg: #0b3440;
            --highlight-bg: rgba(255, 107, 53, 0.15);
        }

        [data-theme="eyeprotectant"] {
            --bg: #f4ecd8;
            --surface: #fdf6e3;
            --surface-hover: #f2e7cd;
            
            --text: #4c4031;
            --text-muted: #756a5c;
            --border: #d9ceb2;
            
            --shadow-color: rgba(100, 80, 50, 0.08);
            --shadow-hover: rgba(100, 80, 50, 0.15);
            
            --btn-teal-bg: #0F4C5C;
            --btn-teal-hover: #0c3e4b;
            --btn-navy-bg: #081C24;
            --btn-navy-hover: #051318;
            
            --history-bg: #fdf6e3;
            --highlight-bg: rgba(255, 107, 53, 0.1);
        }

        body[data-font="small"] { --font-size-base: 13px; }
        body[data-font="medium"] { --font-size-base: 15px; }
        body[data-font="large"] { --font-size-base: 18px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: var(--font-size-base);
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        .control-panel {
            background-color: var(--surface);
            padding: 15px 20px;
            box-shadow: 0 4px 20px var(--shadow-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 4px solid var(--primary);
            transition: background-color 0.4s ease;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 {
            margin: 0;
            flex-grow: 1;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text);
            min-width: 250px;
        }

        .settings-group {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9em;
            flex-wrap: wrap;
        }

        .settings-group label {
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background-color: var(--primary);
            color: #ffffff;
            padding: 0.7em 1.4em;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px var(--shadow-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--primary-light);
        }

        .btn:disabled {
            background-color: var(--border) !important;
            color: var(--text-muted) !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            opacity: 0.6;
            transform: none !important;
        }

        .btn-teal { background-color: var(--btn-teal-bg); }
        .btn-teal:hover:not(:disabled) { background-color: var(--btn-teal-hover); box-shadow: 0 6px 15px var(--shadow-hover); }

        .btn-navy { background-color: var(--btn-navy-bg); }
        .btn-navy:hover:not(:disabled) { background-color: var(--btn-navy-hover); box-shadow: 0 6px 15px var(--shadow-hover); }

        .btn-red { background-color: #dc3545; }
        .btn-red:hover:not(:disabled) { background-color: #c82333; }

        .btn-outline {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .btn-outline:hover:not(:disabled) { background-color: var(--surface-hover); }

        .btn-small { padding: 0.5em 1em; font-size: 0.85em; }

        .options-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95em;
            font-weight: 600;
        }

        select, .search-box input[type="text"] {
            padding: 0.6em 1em;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, .search-box input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-box input[type="text"] { width: 240px; max-width: 100%; }

        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #status {
            font-weight: 600;
            font-size: 0.95em;
            color: var(--primary);
            width: 100%;
            margin-top: 5px;
        }

        .summary-dashboard, .saved-files-panel {
            max-width: 1150px;
            margin: 20px auto 0;
            padding: 0 15px;
        }

        .summary-card {
            background: var(--surface);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            border-left: 5px solid var(--primary);
        }

        .summary-title {
            font-size: 0.9em;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.95em;
            margin-top: 15px;
        }

        .summary-stat {
            background: var(--surface-hover);
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .summary-stat span {
            font-weight: 700;
            color: var(--primary);
        }

        .saved-files-header {
            font-size: 1.15em;
            margin-bottom: 15px;
            color: var(--text);
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box-container {
            display: flex; 
            flex-direction: column; 
            align-items: flex-end;
            width: 100%;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            justify-content: flex-end;
        }

        #search-result {
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--history-bg);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px var(--shadow-color);
            border: 1px solid var(--border);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .history-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--shadow-hover);
        }
        
        .history-item.printed-row {
            border-left: 5px solid #28a745;
            opacity: 0.85;
        }

        .history-item.highlight-match {
            background-color: var(--highlight-bg);
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            min-width: 250px;
        }

        .history-name {
            font-weight: 700;
            font-size: 1.05em;
            color: var(--text);
            word-break: break-all;
        }

        .history-meta-row {
            display: flex;
            gap: 10px;
            font-size: 0.85em;
            color: var(--text-muted);
            align-items: center;
            flex-wrap: wrap;
        }

        .company-badge {
            background-color: var(--surface-hover);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .history-date { color: var(--text-muted); font-weight: 500;}

        .history-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0; 
            justify-content: flex-end;
            width: 100%;
        }

        .print-status-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            background: var(--surface-hover);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text);
            transition: background 0.2s;
        }

        #labels-container {
            max-width: 700px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            padding: 0 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .label-card {
            background: #ffffff; 
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 25px var(--shadow-color);
            position: relative;
            max-width: 100%;
            box-sizing: border-box;
        }

        canvas {
            border: 1px dashed #b5b5b5;
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* Responsive Layout Tweaks */
        @media (min-width: 768px) {
            .search-box-container { width: auto; }
            .history-actions { width: auto; }
        }

        @media (max-width: 600px) {
            .control-panel { padding: 12px 15px; }
            .container { flex-direction: column; align-items: stretch; gap: 12px; }
            .options-group { margin-left: 0 !important; width: 100%; justify-content: space-between; }
            .file-input-wrapper, .btn { width: 100%; }
            .search-box { justify-content: space-between; }
            .search-box input[type="text"] { flex-grow: 1; }
            .history-item { flex-direction: column; align-items: stretch; }
            .history-actions { justify-content: space-between; }
            .history-actions .btn { flex-grow: 1; }
            .print-status-wrapper { width: 100%; justify-content: center; }
        }

        @media print {
            @page { margin: 0; } 
            .no-print { display: none !important; }
            body { background-color: white !important; margin: 0; color: black !important; }
            #labels-container { margin: 0; padding: 0; max-width: 100%; display: block; }
            
            .label-card { 
                box-shadow: none; 
                padding: 0; 
                margin: 0; 
                page-break-after: always; 
                page-break-inside: avoid; 
                display: flex;
                justify-content: center;
                align-items: center;
                height: 98vh;
            }
            canvas { border: none; max-width: 100% !important; max-height: 100% !important; object-fit: contain; }
        }

        /* --- PICK LIST MODAL STYLES --- */
        .picklist-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(3px);
        }
        .picklist-modal {
            background: var(--surface); color: var(--text);
            width: 90%; height: 90%; border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid var(--border);
        }
        .picklist-header {
            padding: 15px 25px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-hover);
        }
        .picklist-header h3 { margin: 0; font-size: 1.3em; }
        .picklist-toolbar {
            padding: 15px 25px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap;
        }
        .picklist-toggles { display: flex; gap: 10px; }
        .picklist-toggles button {
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .picklist-toggles button.active {
            background: var(--primary); color: #fff; border-color: var(--primary);
        }
        .picklist-search input {
            padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--surface); color: var(--text); width: 250px;
        }
        .picklist-body { flex-grow: 1; overflow: auto; padding: 0; background: var(--bg); }
        .picklist-table { width: 100%; border-collapse: collapse; text-align: left; }
        .picklist-table th {
            position: sticky; top: 0; background: var(--surface-hover);
            border-bottom: 2px solid var(--border); padding: 12px 15px; font-weight: 700;
            z-index: 10;
        }
        .picklist-table td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .picklist-table tbody tr { background: var(--surface); cursor: pointer; transition: background 0.2s; }
        .picklist-table tbody tr:hover { background: var(--highlight-bg); }
        .picklist-table tbody tr.expanded-subrow { background: var(--bg); cursor: default; }
        .picklist-table tbody tr.expanded-subrow:hover { background: var(--bg); }
        
        .th-inner { display: flex; flex-direction: column; gap: 6px; }
        .th-title { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .th-title:hover { color: var(--primary); }
        .col-filter-input {
            width: 100%; padding: 4px 8px; font-size: 0.85em; border: 1px solid var(--border);
            border-radius: 4px; background: var(--surface); color: var(--text);
            box-sizing: border-box; font-weight: normal; cursor: pointer;
        }
        .sort-indicator { font-size: 0.8em; color: var(--primary); }
    </style>
</head>
<body data-font="medium">

    <div class="control-panel no-print">
        <div class="container header-top">
            <h2>📦 Amazon Label Sorter (Cloud Sync)</h2>
            <div class="settings-group">
                <div>
                    <label for="theme-selector">Theme:</label>
                    <select id="theme-selector">
                        <option value="deepblue" selected>Basic Theme</option>
                        <option value="light">White</option>
                        <option value="dark">Dark</option>
                        <option value="eyeprotectant">Eye Protectant</option>
                    </select>
                </div>
                <div>
                    <label for="font-selector">Text Size:</label>
                    <select id="font-selector">
                        <option value="small">Small</option>
                        <option value="medium" selected>Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="container" style="justify-content: space-between;">
            
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; max-width: 800px;">
                <div class="file-input-wrapper">
                    <button class="btn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        Select PDF File
                    </button>
                    <!-- MULTIPLE FILES ENABLED -->
                    <input type="file" id="pdf-file" accept="application/pdf" multiple />
                </div>

                <button class="btn btn-navy" id="print-btn" disabled onclick="handleTopAction('print')">🖨️ Print Labels</button>
                <button class="btn btn-teal" id="download-btn" disabled onclick="handleTopAction('download')">⬇️ Download PDF</button>
                
                <!-- PICK LIST BUTTON MOVED HERE -->
                <button class="btn btn-navy" id="pick-list-btn" onclick="openPickListModal()" style="background-color: var(--primary); color: white;">📦 Pick List</button>
                 <!-- PICK LIST BUTTON MOVED HERE -->
                <button class="btn btn-navy" id="pick-list-btn" onclick="openPickListModal()" style="background-color: var(--primary); color: white;">📦 Pick List</button>
                
                <!-- NEW FIX BUTTON -->
                <button class="btn btn-red" onclick="migrateOldFiles()" style="background-color: #dc3545; color: white;">🛠️ Fix Missing SKUs</button>
            </div>

            <div class="options-group" style="margin-left: auto;">
                <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
                    <div>
                        <label for="sort-strategy">Sort A-Z By:</label>
                        <select id="sort-strategy">
                            <option value="sku">Product SKU</option>
                            <option value="buyer">Customer Name / Order ID</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="status">Waiting for cloud initialization...</div>
        </div>
    </div>

    <div class="summary-dashboard no-print" id="summary-dashboard" style="display: none;">
        <div class="summary-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 10px;">
                <div class="summary-title">📈 Batch Printing Summary Overview</div>
                <button class="btn btn-red btn-small" onclick="deleteAllCloudFiles()">🗑️ Delete All</button>
            </div>
            <div class="summary-grid" id="summary-grid"></div>
        </div>
    </div>

    <div class="saved-files-panel no-print">
        <div class="saved-files-header">
            <span>📂 Cloud Saved File History</span>
            
            <div class="search-box-container">
                <div class="search-box">
                    <button class="btn btn-small" id="merge-print-btn" style="display: none;" onclick="processMultipleFiles()">📑 Print Selected</button>
                    
                    <label style="display:flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:var(--text); cursor:pointer; flex-shrink: 0;">
                        <input type="checkbox" id="multi-search-cb" onchange="toggleMultiSearch()"> Multi
                    </label>
                    <input type="text" id="order-search-input" placeholder="🔍 Search Order ID...">
                    <button class="btn btn-teal btn-small" onclick="searchForOrder()">Locate</button>
                </div>
                <div id="multi-hint" style="display: none; font-size: 11.5px; font-weight: bold; color: var(--primary); margin-top: 6px; padding-right: 10px; text-align: right; width: 100%;">
                    ⚠️ Use commas (,) to separate multiple Order IDs
                </div>
            </div>
            
        </div>
        <div id="search-result"></div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div id="labels-container"></div>

    <!-- PICK LIST MODAL OVERLAY -->
    <div class="picklist-modal-overlay" id="picklist-modal-overlay">
        <div class="picklist-modal">
            <div class="picklist-header">
                <h3>📦 Consolidated Pick List</h3>
                <button class="btn btn-outline btn-small" onclick="closePickListModal()">✖ Close</button>
            </div>
            <div class="picklist-toolbar">
                <div class="picklist-toggles">
                    <button id="pl-btn-sku" class="active" onclick="setPickListView('sku')">SKU Wise</button>
                    <button id="pl-btn-company" onclick="setPickListView('company')">Company Wise</button>
                </div>
                <div class="picklist-search">
                    <input type="text" id="pl-global-search" placeholder="Global Search..." oninput="handlePickListGlobalSearch(event)">
                </div>
                <div>
                    <button class="btn btn-teal btn-small" onclick="downloadPickListExcel()">⬇️ Download Pick List</button>
                </div>
            </div>
            <div class="picklist-body" id="picklist-table-container">
                <!-- Table injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        /* --- UI SETTINGS CONTROLS WITH MEMORY --- */
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('amazon_label_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('theme-selector').value = savedTheme;
            }
            
            const savedFont = localStorage.getItem('amazon_label_font');
            if (savedFont) {
                document.body.setAttribute('data-font', savedFont);
                document.getElementById('font-selector').value = savedFont;
            }
        });

        document.getElementById('theme-selector').addEventListener('change', (e) => {
            const theme = e.target.value;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('amazon_label_theme', theme);
        });

        document.getElementById('font-selector').addEventListener('change', (e) => {
            const font = e.target.value;
            document.body.setAttribute('data-font', font);
            localStorage.setItem('amazon_label_font', font);
        });

        /* --- PDF PROCESSING CORE --- */
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let processedOrders = [];
        let currentPdfDoc = null;
        let temporaryExtractedCompany = "Unknown Seller";
        let currentActiveFileName = "Amazon_Labels.pdf"; 
        window.cloudFiles = []; 
        window.activeSearchQueries = [];

        document.getElementById('pdf-file').addEventListener('change', handleNewUpload);
        document.getElementById('sort-strategy').addEventListener('change', renderSortedLabels);
        
        document.getElementById('order-search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchForOrder();
        });

        document.getElementById('order-search-input').addEventListener('input', function(e) {
            if (e.target.value.trim() === '') searchForOrder();
        });

        function calculateSummaryDashboard(files) {
            const dashboard = document.getElementById('summary-dashboard');
            const grid = document.getElementById('summary-grid');
            
            while (grid.firstChild) {
                grid.removeChild(grid.firstChild);
            }
            
            let totalBatches = files.length;
            let totalPrinted = files.filter(f => f.isPrinted).length;
            
            let companyCounts = {};
            files.forEach(f => {
                let comp = f.companyName || "Unknown Seller";
                let labelCount = parseInt(f.totalLabels) || (f.extractedOrderIds ? f.extractedOrderIds.length : 0);

                if(!companyCounts[comp]) {
                    companyCounts[comp] = { totalFiles: 0, printedFiles: 0, pendingFiles: 0, totalLabels: 0 };
                }
                
                companyCounts[comp].totalFiles++;
                companyCounts[comp].totalLabels += labelCount; 
                
                if(f.isPrinted) companyCounts[comp].printedFiles++;
                else companyCounts[comp].pendingFiles++;
            });

            dashboard.style.display = 'block';

            const totalUploadedDiv = document.createElement('div');
            totalUploadedDiv.className = 'summary-stat';
            totalUploadedDiv.textContent = 'Uploaded Files: ';
            const totalUploadedSpan = document.createElement('span');
            totalUploadedSpan.textContent = totalBatches;
            totalUploadedDiv.appendChild(totalUploadedSpan);
            grid.appendChild(totalUploadedDiv);

            const completedPrintsDiv = document.createElement('div');
            completedPrintsDiv.className = 'summary-stat';
            completedPrintsDiv.textContent = 'Completed Prints: ';
            const completedPrintsSpan = document.createElement('span');
            completedPrintsSpan.textContent = `${totalPrinted} / ${totalBatches}`;
            completedPrintsDiv.appendChild(completedPrintsSpan);
            grid.appendChild(completedPrintsDiv);

            Object.keys(companyCounts).forEach(company => {
                const stats = companyCounts[company];
                const cleanBlock = document.createElement('div');
                cleanBlock.className = "summary-stat";
                
                cleanBlock.appendChild(document.createTextNode(`${company} `));

                const labelsSpan = document.createElement('span');
                labelsSpan.textContent = `(🏷️ ${stats.totalLabels} Labels): `;
                cleanBlock.appendChild(labelsSpan);

                const totalFilesSpan = document.createElement('span');
                totalFilesSpan.style.color = "var(--text)";
                totalFilesSpan.textContent = `${stats.totalFiles} files | `;
                cleanBlock.appendChild(totalFilesSpan);

                const printedSpan = document.createElement('span');
                printedSpan.style.color = '#28a745';
                printedSpan.textContent = `${stats.printedFiles} printed | `;
                cleanBlock.appendChild(printedSpan);

                const pendingSpan = document.createElement('span');
                pendingSpan.style.color = '#dc3545';
                pendingSpan.textContent = `${stats.pendingFiles} pending`;
                cleanBlock.appendChild(pendingSpan);

                grid.appendChild(cleanBlock);
            });
        }

        async function handleNewUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            // Process sequentially to keep memory stable and arrays organized
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (window.cloudFiles && window.cloudFiles.some(f => f.name === file.name)) {
                    alert(`Skipping "${file.name}" - Already added to your history.`);
                    continue; 
                }
                
                currentActiveFileName = file.name;
                await runCoreEngine(file);

                if (typeof window.saveFileToStorage === 'function') {
                    await window.saveFileToStorage(file, temporaryExtractedCompany, processedOrders);
                }
            }
            // Reset input after processing all files
            e.target.value = ""; 
        }

        async function downloadCurrentLabels() {
            const { jsPDF } = window.jspdf;
            const canvases = document.querySelectorAll('#labels-container canvas');
            const statusEl = document.getElementById('status');
            
            if (canvases.length === 0) {
                alert("No labels generated to download!");
                return;
            }

            statusEl.textContent = "Generating compressed PDF... Please wait.";

            try {
                const firstCanvas = canvases[0];
                const width = firstCanvas.width;
                const height = firstCanvas.height;
                
                const pdf = new jsPDF({
                    orientation: width > height ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [width, height],
                    compress: true 
                });

                for (let i = 0; i < canvases.length; i++) {
                    if (i > 0) pdf.addPage([canvases[i].width, canvases[i].height]);
                    
                    const imgData = canvases[i].toDataURL('image/jpeg', 0.45);
                    pdf.addImage(imgData, 'JPEG', 0, 0, canvases[i].width, canvases[i].height);
                }

                let dynamicName = currentActiveFileName.replace(/\.[^/.]+$/, "") + "_rearranged.pdf";
                pdf.save(dynamicName);
                
                statusEl.textContent = "Download complete!";
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error generating PDF download.";
            }
        }

        async function runCoreEngine(fileOrBlob, appendMode = false) {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('labels-container');
            
            if (!appendMode) {
                container.innerHTML = '';
                processedOrders = [];
            }
            
            statusEl.textContent = "Analyzing PDF structure and linking images to text...";
            
            if (!appendMode) temporaryExtractedCompany = "Unknown Seller";
            document.getElementById('print-btn').disabled = true;
            document.getElementById('download-btn').disabled = true;
            
            try {
                const arrayBuffer = await fileOrBlob.arrayBuffer();
                const docInst = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                if (!appendMode) currentPdfDoc = docInst; 

                statusEl.textContent = `Processing ${docInst.numPages} pages...`;
                
                let groupedOrders = [];
                let currentGroup = { labelPageNum: null, labelTextData: null, invoicePages: [] };

                for (let i = 1; i <= docInst.numPages; i++) {
                    const page = await docInst.getPage(i);
                    const textData = await extractTextAndPositions(page);
                    
                    const isInvoice = /Sold By|Tax Invoice|HSN|Invoice Number/i.test(textData.text) || textData.text.length > 150;

                    if (!isInvoice) {
                        if (currentGroup.labelPageNum !== null) groupedOrders.push(currentGroup);
                        currentGroup = { labelPageNum: i, labelTextData: textData, invoicePages: [] };
                    } else {
                        currentGroup.invoicePages.push({ pageNum: i, textData: textData });
                    }
                }
                
                if (currentGroup.labelPageNum !== null || currentGroup.invoicePages.length > 0) {
                    groupedOrders.push(currentGroup);
                }

                for (const group of groupedOrders) {
                    if (group.labelPageNum === null) continue;

                    let buyerName = "Unknown";
                    let sku = "UNKNOWN";
                    let qty = "1";
                    let atsplTargetToken = null;
                    let orderId = "Unknown";

                    if (group.labelTextData && group.labelTextData.text.length > 0) {
                        const buyerMatch = group.labelTextData.text.match(/Ship To:\s*([^\n\r]+)/i);
                        if (buyerMatch) buyerName = buyerMatch[1].trim();
                        atsplTargetToken = group.labelTextData.items.find(item => item.str.includes("ATSPL"));
                    }

                    let combinedInvoiceText = "";
                    for (const inv of group.invoicePages) {
                        combinedInvoiceText += inv.textData.text + " \n ";
                    }

                    if (combinedInvoiceText) {
                        const companyMatch = combinedInvoiceText.match(/Sold By\s*:\s*([^\n\r]+)/i);
                        if (companyMatch && temporaryExtractedCompany === "Unknown Seller") {
                            temporaryExtractedCompany = companyMatch[1].trim();
                        }

                        const orderIdMatch = combinedInvoiceText.match(/\d{3}-\d{7}-\d{7}/);
                        if (orderIdMatch) orderId = orderIdMatch[0];

                        if (buyerName === "Unknown") {
                            const billingMatch = combinedInvoiceText.match(/(?:Billing Address|Shipping Address)\s*:\s*([^\n\r]+)/i);
                            if (billingMatch) buyerName = billingMatch[1].trim();
                            else buyerName = `Order ID: ${orderId}`;
                        }

                        let skus = [];
                        let qtys = [];

                        const newSkuRegex = /\|\s*(?:B[a-zA-Z0-9]{9})\s*([^|]*?)\s*HSN/gi;
                        let skuMatch;
                        while ((skuMatch = newSkuRegex.exec(combinedInvoiceText)) !== null) {
                            let rawSku = skuMatch[1].replace(/^\s*\(|\)\s*$/g, '').trim(); 
                            skus.push(rawSku);
                            
                            let textChunk = combinedInvoiceText.substring(newSkuRegex.lastIndex, newSkuRegex.lastIndex + 250);
                            let rupeeQtyMatch = textChunk.match(/₹\s*[\d,.]+\s+(?:-?₹\s*[\d,.]+\s+)?(\d{1,4})\s+₹/);
                            if (rupeeQtyMatch) { qtys.push(rupeeQtyMatch[1].trim()); } 
                            else { qtys.push("1"); }
                        }

                        if (skus.length === 0) {
                            const legacySkuRegex = /\(([^)]+)\)\s*HSN/gi;
                            while ((skuMatch = legacySkuRegex.exec(combinedInvoiceText)) !== null) {
                                skus.push(skuMatch[1].replace(/^\s+|\s+$/g, ''));
                                
                                let textChunk = combinedInvoiceText.substring(legacySkuRegex.lastIndex, legacySkuRegex.lastIndex + 250);
                                let rupeeQtyMatch = textChunk.match(/₹\s*[\d,.]+\s+(?:-?₹\s*[\d,.]+\s+)?(\d{1,4})\s+₹/);
                                if (rupeeQtyMatch) { qtys.push(rupeeQtyMatch[1].trim()); } 
                                else { qtys.push("1"); }
                            }
                        }

                        if (skus.length === 0) {
                            const tableRegex = /\d{2,4}-\d{2}-\d{2,4}["']?\s*,\s*["']?([^"'\n\r,]+)["']?/gi;
                            let tableMatch;
                            while ((tableMatch = tableRegex.exec(combinedInvoiceText)) !== null) {
                                let possibleSku = tableMatch[1].trim();
                                if (possibleSku && possibleSku.length > 2) {
                                    skus.push(possibleSku);
                                }
                            }

                            if (skus.length > 0) {
                                let generalRupeeMatch = combinedInvoiceText.match(/₹\s*[\d,.]+\s+(?:-?₹\s*[\d,.]+\s+)?(\d{1,4})\s+₹/);
                                if (generalRupeeMatch) qtys.push(generalRupeeMatch[1].trim());
                                else qtys.push("1");
                            }
                        }

                        if (skus.length === 0) {
                            const fallbackMatch = combinedInvoiceText.match(/(MASSAGER|HAIR TRIMMER|SPORTING GOODS|WATER DISPENSER)/i);
                            if (fallbackMatch) skus.push(fallbackMatch[1].trim());
                            
                            if (skus.length > 0) {
                                let generalRupeeMatch = combinedInvoiceText.match(/₹\s*[\d,.]+\s+(?:-?₹\s*[\d,.]+\s+)?(\d{1,4})\s+₹/);
                                if (generalRupeeMatch) qtys.push(generalRupeeMatch[1].trim());
                                else qtys.push("1");
                            }
                        }

                        let finalSkuString = "UNKNOWN";
                        let totalQty = 1;
                        let extractedRawItems = []; 
                        
                        if (skus.length > 0) {
                            let itemBreakdowns = [];
                            totalQty = 0;
                            
                            for (let i = 0; i < skus.length; i++) {
                                let q = qtys[i] || "1"; 
                                itemBreakdowns.push(`${skus[i]} (QTY: ${q})`);
                                totalQty += parseInt(q, 10) || 1;
                                extractedRawItems.push({ sku: skus[i], qty: parseInt(q, 10) || 1 });
                            }
                            finalSkuString = itemBreakdowns.join(" | "); 
                        }

                        sku = finalSkuString;
                        qty = totalQty.toString();
                        
                        if(extractedRawItems.length === 0) {
                            extractedRawItems.push({ sku: sku, qty: parseInt(qty, 10) || 1 });
                        }

                        processedOrders.push({
                            pdfDoc: docInst, 
                            labelPageNum: group.labelPageNum,
                            buyerName: buyerName,
                            sku: sku,
                            qty: qty,
                            atsplToken: atsplTargetToken,
                            orderId: orderId,
                            rawItems: extractedRawItems
                        });
                    } else {
                        processedOrders.push({
                            pdfDoc: docInst, 
                            labelPageNum: group.labelPageNum,
                            buyerName: buyerName,
                            sku: sku,
                            qty: qty,
                            atsplToken: atsplTargetToken,
                            orderId: orderId,
                            rawItems: [{ sku: sku, qty: parseInt(qty, 10) || 1 }]
                        });
                    }
                }

                if (!appendMode) {
                    statusEl.textContent = `Completed! Mapped and sorted ${processedOrders.length} image labels.`;
                    document.getElementById('print-btn').disabled = false;
                    document.getElementById('download-btn').disabled = false;
                    await renderSortedLabels();
                }

            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error parsing file format.";
            }
        }

        async function extractTextAndPositions(page) {
            const textContent = await page.getTextContent();
            let text = "";
            textContent.items.forEach(item => {
                text += item.str + " \n ";
            });
            return { text, items: textContent.items };
        }

        async function renderSortedLabels() {
            if (processedOrders.length === 0) return;

            const strategy = document.getElementById('sort-strategy').value;
            const container = document.getElementById('labels-container');
            container.innerHTML = '<p class="no-print" style="color: var(--text-muted); font-weight: 600;">Arranging and sorting templates...</p>';

            const sorted = [...processedOrders].sort((a, b) => {
                let valA = strategy === 'sku' ? a.sku : a.buyerName;
                let valB = strategy === 'sku' ? b.sku : b.buyerName;
                return valA.localeCompare(valB, undefined, { sensitivity: 'base', numeric: true });
            });

            container.innerHTML = '';

            for (const order of sorted) {
                const card = document.createElement('div');
                card.className = 'label-card';
                
                const canvas = document.createElement('canvas');
                card.appendChild(canvas);
                container.appendChild(card);

                const docToUse = order.pdfDoc || currentPdfDoc;
                const page = await docToUse.getPage(order.labelPageNum);
                
                const scale = 1.2; 
                const viewport = page.getViewport({ scale });
                const ctx = canvas.getContext('2d');
                
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                let renderX, renderY;

                if (order.atsplToken) {
                    const [cx, cy] = viewport.convertToViewportPoint(order.atsplToken.transform[4], order.atsplToken.transform[5]);
                    renderX = cx;
                    renderY = cy - (16 * scale); 
                } else {
                    renderX = canvas.width * 0.06;
                    renderY = canvas.height * 0.81;
                }

                const textToInject = `QTY: ${order.qty} | ${order.sku}`;

                let fontSize = 16;
                if (textToInject.length > 45) fontSize = 12;
                if (textToInject.length > 65) fontSize = 10;
                if (textToInject.length > 85) fontSize = 8; 

                ctx.fillStyle = "black";
                ctx.font = `bold ${fontSize * scale}px Arial`;
                                
                ctx.fillStyle = "white";
                const metrics = ctx.measureText(textToInject);

                const boxPadding = 12;
                const boxHeight = (fontSize + 3) * scale;
                ctx.fillRect(renderX - 4, renderY - (fontSize * scale), metrics.width + boxPadding, boxHeight);
                                
                ctx.fillStyle = "black";
                ctx.fillText(textToInject, renderX, renderY);
            }
        }
    </script>
    
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAKRuQM3vVwMrLprVYgXtrKucC_NJy-LgI",
        authDomain: "shipping-label-79465.firebaseapp.com",
        projectId: "shipping-label-79465",
        storageBucket: "shipping-label-79465.firebasestorage.app",
        messagingSenderId: "520834437222",
        appId: "1:520834437222:web:247f6eab081a116e55dda7"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      async function markCurrentFilesAsPrinted() {
          if (!processedOrders || processedOrders.length === 0) return;
          let activeOrderIds = [...new Set(processedOrders.map(o => o.orderId))];
          let docIdsToMark = new Set();
          
          window.cloudFiles.forEach(file => {
              if (file.extractedOrderIds && file.extractedOrderIds.some(id => activeOrderIds.includes(id))) {
                  docIdsToMark.add(file.id);
              }
          });
          
          for (const docId of docIdsToMark) {
              await window.toggleCloudPrintStatus(docId, true);
              let checkbox = document.querySelector(`.multi-select-pdf[data-docid="${docId}"]`);
              if (checkbox) {
                  let wrapper = checkbox.closest('.history-item');
                  if (wrapper) {
                      let printCb = wrapper.querySelector('.print-status-wrapper input[type="checkbox"]');
                      if (printCb) printCb.checked = true;
                  }
              }
          }
      }

      window.handleTopAction = async function(action) {
          if (window.activeSearchQueries && window.activeSearchQueries.length > 0) {
              const queries = window.activeSearchQueries;
              const filesToProcess = window.cloudFiles.filter(f => {
                  if (f.extractedOrderData) return f.extractedOrderData.some(str => queries.includes(str.split('::')[0]));
                  else if (f.extractedOrderIds) return queries.some(q => f.extractedOrderIds.includes(q));
                  return false;
              });

              if (filesToProcess.length === 0) return;

              const statusEl = document.getElementById('status');
              const container = document.getElementById('labels-container');
              document.getElementById('print-btn').disabled = true;
              document.getElementById('download-btn').disabled = true;
              container.innerHTML = '<p class="no-print" style="font-weight: 600; color: var(--primary);">Fetching files from cloud and isolating searched labels...</p>';
              
              processedOrders = []; 

              try {
                  for (let i = 0; i < filesToProcess.length; i++) {
                      const targetFile = filesToProcess[i];
                      const docId = targetFile.id;
                      statusEl.textContent = `Extracting ${targetFile.name} (${i + 1}/${filesToProcess.length})...`;

                      let fullBase64 = "";
                      if (targetFile.fileData) {
                          fullBase64 = targetFile.fileData;
                      } else {
                          const chunksQuery = query(collection(db, `orders/${docId}/chunks`), orderBy("index", "asc"));
                          const chunksSnapshot = await getDocs(chunksQuery);
                          chunksSnapshot.forEach(d => { fullBase64 += d.data().data; });
                      }

                      const response = await fetch(fullBase64);
                      const blob = await response.blob();
                      
                      await runCoreEngine(blob, true); 
                  }

                  processedOrders = processedOrders.filter(o => queries.includes(o.orderId));

                  statusEl.textContent = `Isolated & Sorted ${processedOrders.length} matching labels.`;
                  document.getElementById('print-btn').disabled = false;
                  document.getElementById('download-btn').disabled = false;

                  await renderSortedLabels();

                  setTimeout(async () => {
                      if (action === 'print') {
                          await markCurrentFilesAsPrinted();
                          window.print();
                      }
                      else if (action === 'download') downloadCurrentLabels();
                  }, 1000);

              } catch (err) {
                  console.error(err);
                  statusEl.textContent = "Error extracting files. Check the console.";
              }
          } else {
              if (action === 'print') {
                  await markCurrentFilesAsPrinted();
                  window.print();
              }
              else if (action === 'download') downloadCurrentLabels();
          }
      };

      window.toggleMultiSearch = function() {
          const cb = document.getElementById('multi-search-cb');
          const input = document.getElementById('order-search-input');
          const hint = document.getElementById('multi-hint');
          
          if (cb.checked) {
              hint.style.display = 'block';
          } else {
              hint.style.display = 'none';
              let val = input.value;
              if (val.includes(',')) val = val.split(',')[0].trim();
              input.value = val;
              searchForOrder();
          }
      };

      window.renderHistoryList = function(filesToRender, highlightIds = []) {
          const historyList = document.getElementById('history-list');
          historyList.innerHTML = '';
          
          if (filesToRender.length === 0 && window.cloudFiles.length === 0) {
              historyList.innerHTML = '<div style="font-size: 15px; font-weight: 600; color: var(--text-muted); padding: 20px;">No files loaded. Process a new shipping batch to begin.</div>';
              document.getElementById('summary-dashboard').style.display = 'none';
              return;
          }

          filesToRender.forEach(fileDoc => {
              const item = document.createElement('div');
              let classes = ['history-item'];
              if (fileDoc.isPrinted) classes.push('printed-row');
              if (highlightIds.includes(fileDoc.id)) classes.push('highlight-match');
              item.className = classes.join(' ');
              
              const displayCompany = fileDoc.companyName || "Unknown Seller";
              const checkedAttribute = fileDoc.isPrinted ? "checked" : "";
              
              const count = fileDoc.totalLabels || (fileDoc.extractedOrderIds ? fileDoc.extractedOrderIds.length : '?');
              const labelCountText = `🏷️ ${count} Labels`;

              let pageBadge = '';
              if (highlightIds.includes(fileDoc.id)) {
                  let pageText = fileDoc._tempMatchedPages ? fileDoc._tempMatchedPages : "N/A";
                  pageBadge = `<span class="company-badge" style="background-color: var(--highlight-bg); border-color: var(--primary); color: var(--primary);">Page(s): ${pageText}</span>`;
              }

              item.innerHTML = `
                  <div style="display: flex; align-items: center; gap: 12px; flex-grow: 1; min-width: 0;">
                      <input type="checkbox" class="multi-select-pdf" data-docid="${fileDoc.id}" onchange="handleMultiSelect()" style="flex-shrink:0;">
                      <div class="history-info" style="min-width: 0;">
                          <span class="history-name">${fileDoc.name}</span>
                          <div class="history-meta-row">
                              <span class="company-badge">🏢 ${displayCompany}</span>
                              <span class="company-badge" style="background-color: var(--primary-light); border-color: var(--primary); color: var(--text);">${labelCountText}</span>
                              <span class="history-date">${fileDoc.date}</span>
                              ${pageBadge}
                          </div>
                      </div>
                  </div>
                  <div class="history-actions">
                      <label class="print-status-wrapper">
                          <input type="checkbox" ${checkedAttribute} onchange="toggleCloudPrintStatus('${fileDoc.id}', this.checked)">
                          Done Printing
                      </label>
                      <button class="btn btn-outline btn-small" onclick="downloadOriginalCloudFile('${fileDoc.id}', '${fileDoc.name}')">Original</button>
                      <button class="btn btn-navy btn-small" onclick="processStoredFile('${fileDoc.id}', 'print')">Print</button>
                      <button class="btn btn-teal btn-small" onclick="processStoredFile('${fileDoc.id}', 'download')">Download</button>
                      <button class="btn btn-red btn-small" onclick="deleteCloudFile('${fileDoc.id}')">Delete</button>
                  </div>
              `;
              historyList.appendChild(item);
          });
          window.handleMultiSelect(); 
      };

      window.saveFileToStorage = async function(file, companyName = "Unknown Seller", processedDataArray = []) {
        const statusEl = document.getElementById('status');
        statusEl.textContent = "Encoding and prepping high-speed parallel upload to Cloud...";

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64PdfString = e.target.result;
            const CHUNK_SIZE = 800000; 
            const numChunks = Math.ceil(base64PdfString.length / CHUNK_SIZE);

            try {
              const orderDocRef = await addDoc(collection(db, "orders"), {
                name: file.name,
                companyName: companyName,
                isPrinted: false,
                date: new Date().toLocaleString(),
                timestamp: Date.now(), 
                totalLabels: processedDataArray.length, 
                chunksCount: numChunks,
                extractedOrderData: processedDataArray.map(o => `${o.orderId}::${o.labelPageNum}`),
                extractedOrderIds: processedDataArray.map(o => o.orderId).filter(id => id !== "Unknown"),
                pickListData: processedDataArray.map(o => ({ orderId: o.orderId, items: o.rawItems || [] }))
              });

              let completedChunks = 0;
              const uploadPromises = [];

              for (let i = 0; i < numChunks; i++) {
                  const chunkData = base64PdfString.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                  
                  const uploadTask = addDoc(collection(db, `orders/${orderDocRef.id}/chunks`), {
                      index: i,
                      data: chunkData
                  }).then(() => {
                      completedChunks++;
                      statusEl.textContent = `Rapid syncing: chunk ${completedChunks} of ${numChunks}...`;
                  });
                  
                  uploadPromises.push(uploadTask);
              }

              await Promise.all(uploadPromises);
              statusEl.textContent = "Saved to cloud successfully!";
            } catch (error) {
              console.error("Cloud Error:", error);
              statusEl.textContent = "Error saving asset to cloud. Verify Firestore rules.";
            }
        };
        reader.readAsDataURL(file);
      };

      window.searchForOrder = function() {
        const inputVal = document.getElementById('order-search-input').value;
        const cb = document.getElementById('multi-search-cb');
        const resultEl = document.getElementById('search-result');
        const printBtn = document.getElementById('print-btn');
        const downBtn = document.getElementById('download-btn');
        
        if(!inputVal.trim()) { 
            resultEl.innerHTML = ""; 
            window.activeSearchQueries = [];
            
            printBtn.innerHTML = "🖨️ Print Labels";
            downBtn.innerHTML = "⬇️ Download PDF";
            printBtn.style.backgroundColor = "";
            printBtn.style.boxShadow = "";
            printBtn.disabled = processedOrders.length === 0;
            downBtn.disabled = processedOrders.length === 0;
            
            window.renderHistoryList(window.cloudFiles); 
            return; 
        }
        
        let queries = [];
        if (cb.checked) {
            queries = inputVal.split(',').map(s => s.trim()).filter(s => s);
        } else {
            queries = [inputVal.trim()];
        }
        window.activeSearchQueries = queries;

        let matchedFiles = [];
        let unmatchedFiles = [];
        let matchedIds = [];
        let matchedNames = [];

        if (window.cloudFiles) {
            window.cloudFiles.forEach(f => {
                let hasMatch = false;
                let matchedPages = [];

                if (f.extractedOrderData) {
                    f.extractedOrderData.forEach(str => {
                        const parts = str.split('::');
                        if (parts.length === 2 && queries.includes(parts[0])) {
                            hasMatch = true;
                            matchedPages.push(parts[1]);
                        }
                    });
                } else if (f.extractedOrderIds) {
                    if (queries.some(q => f.extractedOrderIds.includes(q))) {
                        hasMatch = true;
                    }
                }

                if (hasMatch) {
                    f._tempMatchedPages = matchedPages.length > 0 ? [...new Set(matchedPages)].join(', ') : "Unknown";
                    matchedFiles.push(f);
                    matchedIds.push(f.id);
                    matchedNames.push(f.name);
                } else {
                    unmatchedFiles.push(f);
                }
            });
        }
        
        if(matchedFiles.length > 0) {
            resultEl.style.color = "var(--primary)";
            resultEl.innerHTML = `✅ Found in: <strong>${matchedNames.join(', ')}</strong>.`;
            
            printBtn.innerHTML = `🖨️ Print Searched (${queries.length})`;
            downBtn.innerHTML = `⬇️ Download Searched (${queries.length})`;
            printBtn.style.backgroundColor = "var(--primary)";
            printBtn.style.boxShadow = "0 0 12px var(--primary-light)";
            printBtn.disabled = false;
            downBtn.disabled = false;

            window.renderHistoryList([...matchedFiles, ...unmatchedFiles], matchedIds);
        } else {
            resultEl.style.color = "#dc3545";
            resultEl.innerHTML = `❌ Order ID not located. Confirm character formatting matches parameters.`;

            printBtn.innerHTML = "🖨️ Print Labels";
            downBtn.innerHTML = "⬇️ Download PDF";
            printBtn.style.backgroundColor = "";
            printBtn.style.boxShadow = "";
            printBtn.disabled = true;
            downBtn.disabled = true;

            window.renderHistoryList(window.cloudFiles); 
        }
      };

    <script>
        window.pickListState = {
            isOpen: false,
            view: 'sku', // 'sku' | 'company'
            expandedRowId: null,
            sortCol: 'qty',
            sortDir: 'desc',
            filters: {}, 
            globalSearch: '',

            document.getElementById('pl-btn-company').classList.toggle('active', viewType === 'company');
            renderPickListTable();

        window.handlePickListGlobalSearch = function(e) {
            window.pickListState.globalSearch = e.target.value.toLowerCase();
            renderPickListTable();
        };

        window.handlePickListFilter = function(e) {
            const col = e.target.dataset.col;
            window.pickListState.filters[col] = e.target.value;
            renderPickListTable();
        };

        window.setPickListSort = function(col) {
            if (window.pickListState.sortCol === col) {
                if (window.pickListState.sortDir === 'desc') window.pickListState.sortDir = 'asc';
                else if (window.pickListState.sortDir === 'asc') window.pickListState.sortDir = null;
                else window.pickListState.sortDir = 'desc';
            } else {
                window.pickListState.sortCol = col;
                window.pickListState.sortDir = 'desc';
            }
            renderPickListTable();
        };

        window.togglePickListExpand = function(id) {
            if (window.pickListState.expandedRowId === id) {
                window.pickListState.expandedRowId = null;
            } else {
                window.pickListState.expandedRowId = id;
            }
            renderPickListTable();
        };

        window.updatePickListCache = function() {
            let skuMap = {};
            let compMap = {};

            if (window.cloudFiles) {
                window.cloudFiles.forEach(file => {
                    let compName = file.companyName || "Unknown Seller";
                    let pickData = file.pickListData || []; 

                    pickData.forEach(order => {
                        let orderId = order.orderId;
                        let items = order.items || [];
                        
                        items.forEach(item => {
                            let s = (item.sku || "UNKNOWN").trim();
                            if (s.length > 55) s = s.substring(0, 55) + "..."; 
                            let q = parseInt(item.qty, 10) || 1;

                            // Aggregate SKU Wise
                            if(!skuMap[s]) skuMap[s] = { sku: s, orders: new Set(), qty: 0, companies: new Set(), compBreakdown: {} };
                            skuMap[s].orders.add(orderId);
                            skuMap[s].qty += q;
                            skuMap[s].companies.add(compName);
                            
                            if(!skuMap[s].compBreakdown[compName]) skuMap[s].compBreakdown[compName] = { comp: compName, orders: new Set(), qty: 0 };
                            skuMap[s].compBreakdown[compName].orders.add(orderId);
                            skuMap[s].compBreakdown[compName].qty += q;

                            // Aggregate Company Wise
                            if(!compMap[compName]) compMap[compName] = { comp: compName, skus: new Set(), orders: new Set(), qty: 0, skuBreakdown: {} };
                            compMap[compName].skus.add(s);
                            compMap[compName].orders.add(orderId);
                            compMap[compName].qty += q;

                            if(!compMap[compName].skuBreakdown[s]) compMap[compName].skuBreakdown[s] = { sku: s, orders: new Set(), qty: 0 };
                            compMap[compName].skuBreakdown[s].orders.add(orderId);
                            compMap[compName].skuBreakdown[s].qty += q;
                        });
                    });
                });
            }

            window.pickListState.rawCache.skuWise = Object.values(skuMap).map(v => ({
                id: v.sku, sku: v.sku, orders: v.orders.size, qty: v.qty, companies: v.companies.size,
                breakdown: Object.values(v.compBreakdown).map(b => ({ id: b.comp, comp: b.comp, orders: b.orders.size, qty: b.qty }))
            }));

            window.pickListState.rawCache.companyWise = Object.values(compMap).map(v => ({
                id: v.comp, comp: v.comp, skus: v.skus.size, orders: v.orders.size, qty: v.qty,
                breakdown: Object.values(v.skuBreakdown).map(b => ({ id: b.sku, sku: b.sku, orders: b.orders.size, qty: b.qty }))
            }));

            if(window.pickListState.isOpen) renderPickListTable();
        };

        function getFilteredAndSortedPickList() {
            let view = window.pickListState.view;
            let rawData = view === 'sku' ? window.pickListState.rawCache.skuWise : window.pickListState.rawCache.companyWise;
            let filters = window.pickListState.filters;
            let search = window.pickListState.globalSearch;

            // 1. DEEP CLONE: This allows us to filter inside SKUs safely
            let data = rawData.map(row => ({
                ...row,
                breakdown: [...row.breakdown]
            }));

            // 2. GLOBAL SEARCH: Applies to both the main rows AND the inside SKUs
            if(search) {
                data = data.filter(row => {
                    let parentMatch = Object.values(row).some(v => typeof v !== 'object' && String(v).toLowerCase().includes(search));
                    
                    let matchingSubRows = row.breakdown.filter(sub => {
                        return Object.values(sub).some(v => String(v).toLowerCase().includes(search));
                    });

                    // If inside SKUs match the search, filter the inside list to ONLY show those!
                    if (matchingSubRows.length > 0) {
                        row.breakdown = matchingSubRows; 
                        return true;
                    }
                    
                    return parentMatch;
                });
            }

            // 3. DROPDOWN FILTERS
            for (let col in filters) {
                let fVal = filters[col];
                if(!fVal) continue;
                data = data.filter(row => String(row[col]) === String(fVal));
            }

            // 4. SORTING: Main Parent Rows
            let sc = window.pickListState.sortCol;
            let sd = window.pickListState.sortDir;
            if(sc && sd) {
                data.sort((a,b) => {
                    let valA = a[sc];
                    let valB = b[sc];
                    if(valA < valB) return sd === 'asc' ? -1 : 1;
                    if(valA > valB) return sd === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            return data;
        }

        function getSortIconHtml(col) {
            if (window.pickListState.sortCol !== col || !window.pickListState.sortDir) return '↕';
            return window.pickListState.sortDir === 'asc' ? '↑' : '↓';
        }

        function getFilterDropdown(colKey) {
            let view = window.pickListState.view;
            let rawData = view === 'sku' ? window.pickListState.rawCache.skuWise : window.pickListState.rawCache.companyWise;
            
            let uniqueVals = [...new Set(rawData.map(r => r[colKey]))].sort((a,b) => {
                if (typeof a === 'number') return a - b;
                return String(a).localeCompare(String(b));
            });
            
            let curr = window.pickListState.filters[colKey] || '';
            let opts = `<option value="">(All)</option>`;
            uniqueVals.forEach(v => {
                let sel = String(v) === String(curr) ? 'selected' : '';
                opts += `<option value="${v}" ${sel}>${v}</option>`;
            });
            return `<select class="col-filter-input" data-col="${colKey}" onchange="handlePickListFilter(event)" onclick="event.stopPropagation()">${opts}</select>`;
        }

            let html = '<table class="picklist-table" style="width: 100%;">';

                            <th style="text-align: center;">
                                <div class="th-inner">
                                    <div class="th-title" onclick="setPickListSort('skus')" style="justify-content: center;">SKUs <span class="sort-indicator" style="margin-left: 4px;">${getSortIconHtml('skus')}</span></div>
                                    ${getFilterDropdown('skus')}
                                </div>
                            </th>
                            <th style="text-align: center;">
                                <div class="th-inner">
                                    <div class="th-title" onclick="setPickListSort('orders')" style="justify-content: center;">Orders <span class="sort-indicator" style="margin-left: 4px;">${getSortIconHtml('orders')}</span></div>
                                    ${getFilterDropdown('orders')}
                                </div>
                            </th>
                            <th style="text-align: center;">
                                <div class="th-inner">
                                    <div class="th-title" onclick="setPickListSort('qty')" style="justify-content: center;">Qty <span class="sort-indicator" style="margin-left: 4px;">${getSortIconHtml('qty')}</span></div>
                                    ${getFilterDropdown('qty')}
                                </div>
                            </th>
                        </tr>
                    </thead><tbody>
                `;
            }

            // BODY
            if (data.length === 0) {
                html += `<tr><td colspan="4" style="text-align:center; padding: 30px; color: var(--text-muted);">No records found matching filters.</td></tr>`;
            }

            data.forEach(row => {
                const isExpanded = window.pickListState.expandedRowId === row.id;
                const encodedId = encodeURIComponent(row.id);
                
                if (view === 'sku') {
                    html += `<tr data-id="${encodedId}" onclick="togglePickListExpand(decodeURIComponent(this.dataset.id))">
                        <td style="font-weight: 600; text-align: left;">${isExpanded ? '▼' : '▶'} ${row.sku}</td>
                        <td style="text-align: center;">${row.orders}</td>
                        <td style="color: var(--primary); font-weight: 700; text-align: center;">${row.qty}</td>
                        <td style="text-align: center;">${row.companies}</td>
                    </tr>`;
                    
                    if (isExpanded) {
                        row.breakdown.sort(dynamicSubSorter).forEach(sub => {
                            html += `<tr class="expanded-subrow">
                                <td style="padding-left: 40px; color: var(--text-muted); text-align: left;">└─ ${sub.comp}</td>
                                <td style="color: var(--text-muted); text-align: center;">${sub.orders}</td>
                                <td style="color: var(--text-muted); font-weight: 600; text-align: center;">${sub.qty}</td>
                                <td></td>
                            </tr>`;
                        });
                    }
                } else {
                    html += `<tr data-id="${encodedId}" onclick="togglePickListExpand(decodeURIComponent(this.dataset.id))">
                        <td style="font-weight: 600; text-align: left;">${isExpanded ? '▼' : '▶'} ${row.comp}</td>
                        <td style="text-align: center;">${row.skus}</td>
                        <td style="text-align: center;">${row.orders}</td>
                        <td style="color: var(--primary); font-weight: 700; text-align: center;">${row.qty}</td>
                    </tr>`;
                    
                    if (isExpanded) {
                        row.breakdown.sort(dynamicSubSorter).forEach(sub => {
                            html += `<tr class="expanded-subrow">
                                <td style="padding-left: 40px; color: var(--text-muted); text-align: left;">└─ ${sub.sku}</td>
                                <td></td>
                                <td style="color: var(--text-muted); text-align: center;">${sub.orders}</td>
                                <td style="color: var(--text-muted); font-weight: 600; text-align: center;">${sub.qty}</td>
                            </tr>`;
                        });
                    }
                }
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        };

        window.downloadPickListExcel = function() {
            if (typeof XLSX === 'undefined') {
                alert("Excel library is still loading. Please try again in a moment.");
                return;
            }
            
            let view = window.pickListState.view;
            let filteredData = getFilteredAndSortedPickList();
            let exportArr = [];

            filteredData.forEach(row => {
                if(view === 'sku') {
                    exportArr.push({ "SKU": row.sku, "Orders": row.orders, "Qty": row.qty, "Companies": row.companies });
                    if(window.pickListState.expandedRowId === row.id) {
                        row.breakdown.sort((a,b) => b.qty - a.qty).forEach(b => {
                            exportArr.push({ "SKU": "   └─ " + b.comp, "Orders": b.orders, "Qty": b.qty, "Companies": "" });
                        });
                    }
                } else {
                    exportArr.push({ "Company": row.comp, "SKUs": row.skus, "Orders": row.orders, "Qty": row.qty });
                    if(window.pickListState.expandedRowId === row.id) {
                        row.breakdown.sort((a,b) => b.qty - a.qty).forEach(b => {
                            exportArr.push({ "Company": "   └─ " + b.sku, "SKUs": "", "Orders": b.orders, "Qty": b.qty });
                        });
                    }
                }
            });

            if (exportArr.length === 0) {
                alert("No data available to download.");
                return;
            }

            let ws = XLSX.utils.json_to_sheet(exportArr);
            let wscols = Object.keys(exportArr[0]||{}).map(k => ({wch: Math.max(k.length, 25)}));
            ws['!cols'] = wscols;

            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PickList");
            let fileName = view === 'sku' ? "PickList_SKU_Wise.xlsx" : "PickList_Company_Wise.xlsx";
            XLSX.writeFile(wb, fileName);
        };
    </script>
</body>
</html>
